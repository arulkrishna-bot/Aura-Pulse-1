name: Build Android APK
​on:
push:
branches:
- main
- master
workflow_dispatch:
​jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout Repo
uses: actions/checkout@v4
​- name: Setup Java JDK 17
uses: actions/setup-java@v4
with:
distribution: 'temurin'
java-version: '17'
​- name: Setup Node.js
uses: actions/setup-node@v4
with:
node-version: '22'
​- name: Build Android App with Capacitor
run: |
mkdir -p www
cp index.html www/index.html
cat << 'EOF' > package.json
{
"name": "aurapulse-studio",
"version": "1.0.0",
"dependencies": {
"@capacitor/android": "^6.1.2",
"@capacitor/core": "^6.1.2"
},
"devDependencies": {
"@capacitor/cli": "^6.1.2"
}
}
EOF
cat << 'EOF' > capacitor.config.json
{
"appId": "com.arulkrish.aurapulse",
"appName": "AuraPulse Studio",
"webDir": "www",
"bundledWebRuntime": false,
"server": {
"androidScheme": "https"
}
}
EOF
npm install
npx cap add android
sed -i '/<application/i \    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />' android/app/src/main/AndroidManifest.xml
npx cap sync android
cd android
chmod +x gradlew
./gradlew assembleDebug --no-daemon
​- name: Upload Finished APK
uses: actions/upload-artifact@v4
with:
name: AuraPulse-Studio-Pro-APK
path: android/app/build/outputs/apk/debug/app-debug.apk
retention-days: 14
